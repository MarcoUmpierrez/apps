<div class="fixed right-4 bottom-4 z-50 flex flex-col items-end gap-2">
  @if (expanded()) {
    <div
      class="max-h-64 w-56 overflow-y-auto rounded-xl border border-slate-700 bg-slate-900/95 p-2 text-sm text-white shadow-xl"
    >
      <button
        type="button"
        (click)="onSkip()"
        class="mb-2 min-h-11 w-full touch-manipulation rounded-lg bg-emerald-700 py-2 font-bold"
      >
        {{ t('skipDev') }}
      </button>
      <p class="mb-1 text-xs uppercase tracking-widest text-slate-400">{{ t('jumpToStop') }}</p>
      <div class="mb-3 flex flex-col gap-1">
        @for (stop of stops; track stop.id; let i = $index) {
          <button
            type="button"
            (click)="onJumpToStop(i)"
            class="min-h-11 touch-manipulation rounded-lg bg-slate-800 px-2 py-1 text-left"
          >
            {{ stop.order }}. {{ stop.title[lang()] }}
          </button>
        }
      </div>

      <p class="mb-1 text-xs uppercase tracking-widest text-slate-400">Jump to screen</p>
      <div class="flex flex-col gap-1">
        @for (phase of phases; track phase) {
          <button
            type="button"
            (click)="onJumpToPhase(phase)"
            class="min-h-11 touch-manipulation rounded-lg bg-slate-800 px-2 py-1 text-left"
          >
            {{ phase }}
          </button>
        }
      </div>
    </div>
  }
  <button
    type="button"
    (click)="toggleExpanded()"
    class="min-h-11 min-w-11 touch-manipulation rounded-full bg-red-700 px-3 py-2 text-xs font-bold text-white shadow-lg"
  >
    DEV
  </button>
</div>
