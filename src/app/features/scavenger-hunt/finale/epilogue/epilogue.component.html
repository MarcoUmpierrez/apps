<div class="relative flex min-h-dvh flex-col items-center gap-6 overflow-x-hidden p-6 text-center">
  <app-falling-hearts [showLeaves]="false" />

  <div class="relative z-10 text-7xl">🎉</div>
  <h2 class="relative z-10 font-['Caveat',cursive] text-5xl text-[#e3d5b8]">{{ t('sheSaidYes') }}</h2>

  <div class="relative z-10 grid grid-cols-2 place-items-center gap-x-6 gap-y-5 pb-6">
    @for (stop of stops; track stop.id) {
      <div class="relative">
        <img
          [src]="stop.chapterImage"
          alt=""
          class="h-28 w-28 rounded-full border-2 border-[#e9dec0] object-cover shadow-lg shadow-black/50"
        />
        <img
          src="scavenger-hunt/photos/seal.webp"
          alt=""
          class="absolute -right-2 -bottom-2 h-14 w-14 -rotate-12 object-contain drop-shadow"
        />
      </div>
    }
  </div>

  <button
    type="button"
    (click)="onContinue()"
    class="relative z-10 min-h-14 touch-manipulation rounded-sm border border-[#6b5636] bg-[#3a3f6b] px-8 py-4 font-['Spectral',serif] text-xs tracking-[.24em] text-[#e9dec5] uppercase shadow-lg shadow-black/40 transition-transform active:scale-95"
  >
    {{ t('continueLabel') }}
  </button>

  <app-fireworks-display />
</div>
