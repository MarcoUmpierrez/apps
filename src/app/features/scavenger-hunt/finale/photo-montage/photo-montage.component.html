<div class="flex min-h-dvh flex-col items-center justify-center gap-6 p-6 text-center">
  <h2 class="font-['Caveat',cursive] text-4xl text-[#e3d5b8]">{{ t('ourJourney') }}</h2>

  @if (photos().length > 0) {
    <img
      [src]="photos()[activeIndex()]"
      alt=""
      class="h-64 w-full max-w-xs -rotate-1 rounded-sm border-4 border-[#e9dec0] object-cover shadow-xl shadow-black/50"
    />

    <button
      type="button"
      (click)="onDownload()"
      [disabled]="!collageDataUrl()"
      class="min-h-11 touch-manipulation rounded-sm border border-[#6b5636] px-5 py-2 font-['Spectral',serif] text-xs tracking-[.2em] text-[#e3d5b8] uppercase disabled:opacity-40"
    >
      {{ isBuildingCollage() ? '…' : t('downloadMemory') }}
    </button>
  }
</div>
