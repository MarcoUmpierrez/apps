<div class="flex min-h-dvh flex-col items-center justify-center gap-6 p-6 text-center">
  <img
    [src]="stop().chapterImage"
    alt=""
    class="h-28 w-28 animate-[stamp-in_0.4s_ease-out] -rotate-2 rounded-sm border-4 border-[#e9dec0] object-cover shadow-xl shadow-black/50"
  />
  <h3 class="font-['Caveat',cursive] text-3xl text-[#e3d5b8]">
    {{ t('stampCollected') }}
  </h3>

  @if (stop().notebookInstruction; as instruction) {
    <div class="max-w-xs border border-dashed border-[#6b5636] bg-[#17110b]/40 p-4">
      <p class="mb-1 font-['Spectral',serif] text-[10px] tracking-[.24em] text-[#a3906c] uppercase">
        📓 {{ t('notebookCallout') }}
      </p>
      <p class="font-['Kalam',cursive] text-sm text-[#e3d5b8]">{{ instruction[lang()] }}</p>
    </div>
  }

  <button
    type="button"
    (click)="onContinue()"
    class="min-h-14 touch-manipulation rounded-sm border border-[#6b5636] bg-transparent px-8 py-4 font-['Spectral',serif] text-xs tracking-[.24em] text-[#e3d5b8] uppercase transition-colors active:bg-[#e3d5b8]/10"
  >
    {{ t('continueLabel') }}
  </button>
</div>
