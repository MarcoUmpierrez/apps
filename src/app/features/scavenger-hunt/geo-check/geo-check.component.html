<div
  class="flex min-h-dvh flex-col items-center justify-center gap-6 bg-linear-to-b from-amber-50/60 to-amber-100/60 p-6 text-center"
>
  <h3 class="font-['Caveat',cursive] text-3xl font-bold text-amber-900">
    {{ location().label[lang()] }}
  </h3>

  <app-compass-arrow [bearingDegrees]="bearingDegrees()" />

  @if (isWithinRadius()) {
    <div
      class="arrived-pulse flex flex-col items-center gap-1 rounded-2xl border-2 border-green-700 bg-green-50 px-6 py-3"
    >
      <span class="text-2xl">📍</span>
      <p class="font-['Caveat',cursive] text-2xl font-bold text-green-800">
        {{ t('arrivedBadge') }}
      </p>
    </div>
  } @else if (distanceMeters() !== null) {
    <p class="font-semibold text-amber-800">{{ distanceLabel() }}</p>
  } @else if (geo.permissionState() === 'denied' || geo.permissionState() === 'unsupported') {
    <p class="max-w-xs text-sm text-amber-700">{{ t('locationUnavailable') }}</p>
  }

  <div class="flex flex-col items-center gap-3">
    <button
      type="button"
      (click)="onArrived()"
      class="min-h-14 touch-manipulation rounded-2xl px-8 py-4 text-lg font-bold text-white shadow-lg transition-transform active:scale-95"
      [class.arrived-pulse]="isWithinRadius()"
      [class.bg-green-700]="isWithinRadius()"
      [class.shadow-green-900/30]="isWithinRadius()"
      [class.bg-amber-800]="!isWithinRadius()"
      [class.shadow-amber-900/30]="!isWithinRadius()"
    >
      {{ t('imHere') }}
    </button>
    <button
      type="button"
      (click)="onArrived()"
      class="text-sm font-semibold text-amber-700 underline underline-offset-2"
    >
      {{ t('skipGpsCheck') }}
    </button>
  </div>
</div>
