<div class="flex min-h-dvh flex-col items-center justify-center gap-6 p-6 text-center">
  @if (previewDataUrl(); as photo) {
    <p class="font-['Spectral',serif] text-xs tracking-[.2em] text-[#a3906c] uppercase">
      {{ t('photoTakenBadge') }}
    </p>
    <img
      [src]="photo"
      alt=""
      class="max-h-[50vh] w-full max-w-xs -rotate-1 rounded-sm border-4 border-[#e9dec0] object-contain shadow-xl shadow-black/50"
    />

    <div class="flex w-full max-w-xs flex-col gap-3">
      <button
        type="button"
        (click)="onContinue()"
        class="min-h-14 touch-manipulation rounded-sm border border-[#6b5636] bg-transparent px-8 py-4 font-['Spectral',serif] text-xs tracking-[.24em] text-[#e3d5b8] uppercase transition-colors active:bg-[#e3d5b8]/10"
      >
        {{ t('continueLabel') }}
      </button>
      <button
        type="button"
        (click)="onRetake()"
        class="min-h-11 touch-manipulation font-['Kalam',cursive] text-sm text-[#a3906c] underline underline-offset-2"
      >
        {{ t('retakePhoto') }}
      </button>
    </div>
  } @else {
    <div class="text-6xl">📸</div>
    <p class="max-w-xs font-['Caveat',cursive] text-2xl text-[#e3d5b8]">
      {{ stop().photoCheckpoint?.prompt?.[lang()] }}
    </p>

    <label
      class="min-h-14 w-full max-w-xs touch-manipulation cursor-pointer rounded-sm border border-[#6b5636] bg-transparent px-8 py-4 font-['Spectral',serif] text-xs tracking-[.24em] text-[#e3d5b8] uppercase transition-colors active:bg-[#e3d5b8]/10"
    >
      {{ isProcessing() ? '…' : t('takePhoto') }}
      <input
        type="file"
        accept="image/*"
        capture="environment"
        class="hidden"
        [disabled]="isProcessing()"
        (change)="onFileSelected($event)"
      />
    </label>

    <button
      type="button"
      (click)="onSkip()"
      class="touch-manipulation font-['Kalam',cursive] text-sm text-[#a3906c] underline underline-offset-2"
    >
      {{ t('skipPhoto') }}
    </button>
  }
</div>
